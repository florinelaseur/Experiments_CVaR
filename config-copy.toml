# to give information about the simulations that we are running

[simulation]

input_data = "base-input-data/RIDM-case-study" 
input_data_CC = "base-input-data/RIDM-case-study-CC"
number_of_scenarios = 40
run_benchmark = false
#representative_periods = []
#representative_periods = [30]
representative_periods = [60]
representative_periods_hourly = [60, 180]
#representative_periods = [90]
#representative_periods = [30,60,90,120,180,240,360,365]
solvers = ["Gurobi"]
#solvers = ["HiGHS", "Gurobi"]
fix_level_storage = true
risk_aversion_weight_lambda = 0.2
risk_aversion_confidence_level = 0.90

[clustering]
use_ratio = false
heuristic_distance = false

