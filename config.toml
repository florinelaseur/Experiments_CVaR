# to give information about the simulations that we are running

[simulation]

input_data = "base-input-data/RIDM-case-study" 
number_of_scenarios = 20
run_benchmark = true
representative_periods = []
#representative_periods = [30,60,90]
#representative_periods = [30,60,90,120,180,240,360,365]
solvers = ["Gurobi"]
#solvers = ["HiGHS", "Gurobi"]
fix_level_storage = true
risk_aversion_weight_lambda = 0.1
risk_aversion_confidence_level = 0.90
# Stochastic-dominance screening limits (optional; omit or set to 0 to disable)
sd_max_runtime_sec = 120.0        # stop LP screening loop after this many seconds
sd_solve_time_limit_sec = 30.0    # JuMP per-solve limit passed to Gurobi/HiGHS

[clustering]
use_ratio = false
heuristic_distance = false

