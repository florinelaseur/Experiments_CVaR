# ScenarioReduction experiment configuration (see src/config.jl: load_config).

[paths]
# Relative to repo root
input_data = "base-input-data/RIDM-case-study"
profiles_wide_source = "create-scenarios/profiles-wide-all-scenarios.csv"
# Relative to ScenarioReduction/
output_dir = "outputs/night"
conflict_log = "infeasibility_conflicts.jsonl"

[simulation]
number_of_scenarios = 30
risk_aversion_weight_lambda = 0.1
risk_aversion_confidence_level = 0.90
solvers = ["Gurobi"]
random_seed = 19990907

[run]
filter = true
solve = false
verify_mapping = true
verify_mapping_tol = 1.0e-8

# Dominance screening + scenario picking (legacy section name [stochastic_dominance]
# is still accepted by load_config).
[dominance]
solver = "Gurobi"
sampling_mode = "uniform"
num_samples = 256
number_of_samples_sequences = 1
use_adequacy_cuts = true
mean_shift = false
gaussian_shrinkage = 0.2
gaussian_nonneg_mode = "clip"
record_conflicts = true
# Set to 0 to disable (passes nothing to dominance_screening)
max_runtime_sec = 600000.0
solve_time_limit_sec = 600000.0
# Dominance relation for the screening graph AND pick_n_scenarios peeling,
# shared by all dominance scripts: "pointwise" | "fsd" | "ssd".
dominance_method = "pointwise"
# How many scenarios the dominance peel contributes (hybrid experiment, etc.).
dominance_pick_k = 3

[solve]
representative_periods = 30
hours_per_period = 24
clustering_method = "convex_hull"
clustering_distance = "Euclidean"
weight_type = "dirac"
clustering_learning_rate = 0.001
clustering_niters = 2000
weight_learning_rate = 0.001
weight_niters = 2000
# Pass-through to TEM.create_model!(...; enable_names=...).
use_names = false

[project]
tulipa_energy_model_rev = "227a80f7907e2c7178edb0697874cfb6666ad644"

[experiment]
# Repeatable multi-run experiment driver (run_experiment! in test_stochastic_dominance.jl).
# When enabled, the __main__ block runs the experiment instead of the single run!().
enabled = true
name = "NightNight"
# Base output folder, relative to ScenarioReduction/. Per-run folders are <output_dir>/<name>/runK/.
output_dir = "outputs/experiments"
num_runs = 1
base_seed = 19990906
# Number of input scenarios sampled before screening (per run). Overrides simulation.number_of_scenarios.
num_input_scenarios = 20
# Post-screening full-resolution solves (run_experiment! only). Screening always runs.
run_ground_truth = false          # all sampled scenarios → run<K>/full_resolution_all/
run_selected_scenarios = false      # undominated subset (dominance.dominance_method) → run<K>/full_resolution_undominated/

[hybrid_experiment]
# Hybrid dominance + Kantorovich reduction driver (run_hybrid_experiment! in
# test_dominance_kantorovich.jl). Picks dominance.dominance_pick_k scenarios by
# dominance peeling plus kantorovich_pick_n disjoint scenarios by Kantorovich
# forward selection, solves the reduced set, then evaluates out-of-sample on the
# full set (investments fixed from the reduced solve vs. an unconstrained benchmark).
enabled = true
name = "dom_kant5_30"
# Base output folder, relative to ScenarioReduction/. Per-run folders are <output_dir>/<name>/runK/.
output_dir = "outputs/experiments"
num_runs = 5
base_seed = 19990999
num_input_scenarios = 30
# Scenarios picked by Kantorovich from the complement of the dominance picks.
kantorovich_pick_n = 12
run_full_benchmark = true         # full N-scenario solve, no fixed investments → run<K>/full_benchmark/
run_fixed_full = true             # full N-scenario solve, investments fixed from reduced solve → run<K>/full_fixed/
